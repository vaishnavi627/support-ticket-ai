services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/runtime/support_tickets.duckdb
      DATA_PATH: /app/data/support_tickets.csv
    volumes:
      - ./data:/app/data:ro
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
